name: Deploy to production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/eagle-life-admin-api

            # --- Back up the DB before any schema change; keep the 5 most recent dumps ---
            # Credentials are read from Laravel's .env and never printed.
            BACKUP_DIR=/root/eagle-api-db-backups
            mkdir -p "$BACKUP_DIR"
            DB_DATABASE=$(grep -E '^DB_DATABASE=' .env | cut -d= -f2- | tr -d '"'"'"'"'"'"')
            DB_USERNAME=$(grep -E '^DB_USERNAME=' .env | cut -d= -f2- | tr -d '"'"'"'"'"'"')
            DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | cut -d= -f2- | tr -d '"'"'"'"'"'"')
            DB_HOST=$(grep -E '^DB_HOST=' .env | cut -d= -f2- | tr -d '"'"'"'"'"'"')
            # gzip keeps each dump ~10x smaller (disk is tight on this box).
            MYSQL_PWD="$DB_PASSWORD" mysqldump --single-transaction --quick \
              -h "${DB_HOST:-127.0.0.1}" -u "$DB_USERNAME" "$DB_DATABASE" \
              | gzip > "$BACKUP_DIR/${DB_DATABASE}-$(date +%Y%m%d-%H%M%S).sql.gz"
            ls -1t "$BACKUP_DIR"/*.sql.gz | tail -n +6 | xargs -r rm -f

            # --- Sync code ---
            git fetch origin main
            git reset --hard origin/main

            # --- PHP + JS dependencies, then build frontend assets ---
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build

            # --- Apply migrations (backup above guards against a bad one) ---
            php artisan migrate --force

            # --- Refresh Laravel caches for production ---
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # --- Reload PHP-FPM so opcache picks up new code (root, no sudo needed) ---
            systemctl reload php8.2-fpm
